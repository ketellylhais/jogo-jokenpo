<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JokenPô</title>
</head>

<body>
    <div class="container">
        <h1><span>Joken</span>Pô</h1>

        <button id="rock" onclick="playHuman('rock')"> &#128074;</button>
        <button id="paper" onclick="playHuman('paper')">&#128400</button>
        <button id="scissors" onclick="playHuman('scissors')">&#9996;</button>
        <h2 class="result">...</h2>

        <div class="texto">
            <p>Sua pontuação é: <span class="my-score">0</span></p>
            <p>Pontuação da Alexa: <span class="alexa-score">0</span></p>
        </div>

    </div>
</body>

<script src="script.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-image: url('https://picsum.photos/1920/1080');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center ;
        text-align: center;
        padding: 50px;
        
    }

    h1, h2{
        margin-top: 50px;
    }

    

    .container {
        background-color: #fff;
        margin: 10px auto;
        padding: 20px;
        width: 400px;
        height: 500px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: block;
    }

    .texto{
        margin-top: 30px;
        font-size: 20px;
        font-weight: bold;
        justify-items: center;
    }
    p{
        padding: 5px;
    }


    button {
        font-size: 50px;
        cursor: pointer;
        padding: 15px;
        background: none;
        border: none;
        margin-top: 15%;
        border-radius: 10px;
        transition: all 0.3s ease;
    }

    button:hover {
        transform: scale(1.1);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }

    #rock {
        background-color: gray;
    }
    #paper {
        background-color: rgb(198, 227, 237);
    }
    #scissors {
        background-color: rgb(228, 33, 62);
    }
    .my-score{
        color: green;
    }
    .alexa-score{
        color:rgb(228, 33, 62);
    }
</style>

</html>
