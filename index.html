<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JokenPô</title>
</head>

<body>

    <header>
        <div class="item">
            <p>Você</p>
            <h1 id="my-score">0</h1>
        </div>

        <div class="item">
            <p>Empates</p>
            <h1 id="empate">0</h1>
        </div>

        <div class="item">
            <p>Computador</p>
            <h1 id="alexa-score">0</h1>
        </div>
    </header>

    <section class="middle-container">
        <div class="display-choice">
            <h1>Você</h1>
            <p class="display-my-choice">Faça sua escolha</p>
        </div>

        <div class="display-choice">
            <h1>Computador</h1>
            <p class="display-alexa-choice">Aguardando...</p>
        </div>
    </section>

    <h2 class="result"></h2>

    <section class="bottom-container">
        <button id="stone" onclick="playHuman('stone')"> <img src="assets/rochas.png" alt=""></button>
        <button id="paper" onclick="playHuman('paper')"> <img src="assets/paper.png" alt=""></button>
        <button id="scissors" onclick="playHuman('scissors')"> <img src="assets/scissors.png" alt=""></button>
    </section>
</body>

<script src="script.js"></script>


</html>
